[project]
name = "wumpus-world-api"
version = "1.0.0"
description = "API do Mundo de Wumpus: motor do jogo, base de conhecimento proposicional e agente lógico."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.142.4",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
    "uvicorn>=0.54.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT"]
allowed-confusables = ["∧", "∨", "¬", "⇒", "⇔", "⊨", "⊭", "×", "α"]

[tool.mypy]
strict = true
python_version = "3.12"
files = ["main.py", "wumpus", "tests", "scripts"]
plugins = ["pydantic.mypy"]
